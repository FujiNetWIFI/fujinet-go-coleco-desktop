name: macOS

# Builds whatever exists for macOS -- the core, the session layer, the FujiNet
# runtime, the full test suite, and the AppKit frontend.
#
# This is the ONLY place macOS is compiled: none of frontends/macos was
# written on a Mac, and nothing on the development machine can build
# Objective-C against Cocoa. A failure here is real signal about that code.
#
# WITH_COLECO_ROMS=OFF (the OS-7 BIOS is not redistributable, so boot_smoke,
# debug_test, session_test and media_test report ctest's skip code 77 rather
# than running -- expected here, not a gap). WITH_FUJINET is left at its
# default ON: tools/fujinet/build-fujinet-desktop.sh has Darwin handling
# (libfujinet.dylib, and it builds mbedTLS 3.6.5 from source because
# Homebrew's is 4.x, which drops the mbedtls/md5.h the firmware includes).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    env:
      DYLD_LIBRARY_PATH: /tmp/sdl3-install/lib
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja python3

      - name: Build and install SDL3 (release-3.4.12, pinned)
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3-src
          cmake -S /tmp/sdl3-src -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/sdl3-build
          cmake --install /tmp/sdl3-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=/tmp/sdl3-install \
            -DWITH_COLECO_ROMS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
